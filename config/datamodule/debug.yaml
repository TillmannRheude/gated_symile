splits: data/ukb/REPLACE_WITH_LOCAL_PATH
#splits: data/ukb/REPLACE_WITH_LOCAL_PATH
train_split: 'train'
valid_split: 'valid'
test_split: 'test'
combine_eids_as: 'intersect'  # 'intersect' / 'union' 
num_workers: 4  # 32
batch_size: 48  # 3072  # 512
pin_memory: true
drop_last: true
shuffle: true
keyerr: true  # true if intersect, false if union
